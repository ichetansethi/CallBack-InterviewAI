spring:
  application:
    name: session-history-service
  datasource:
    url: jdbc:postgresql://localhost:5432/callback_session
    username: ${DB_USERNAME:callback_admin}
    password: ${DB_PASSWORD:callback_password123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  http:
    client:
      # Spring AI's OpenAI client is built from Boot's RestClient.Builder; without a read timeout a
      # hung Groq call would block the Kafka listener thread indefinitely.
      connect-timeout: 5s
      read-timeout: 60s
  kafka:
    bootstrap-servers: localhost:9092
  ai:
    model:
      chat: openai
    openai:
      base-url: https://api.groq.com/openai
      api-key: ${GROQ_API_KEY}
      chat:
        options:
          model: openai/gpt-oss-120b
          temperature: 0.2

server:
  port: 8086

session-history:
  kafka:
    topic: session-completed
    group-id: session-history-service
