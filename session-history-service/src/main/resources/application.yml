spring:
  application:
    name: session-history-service
  datasource:
    url: ${SESSION_HISTORY_DB_URL:jdbc:postgresql://localhost:5432/callback_session}
    username: ${DB_USERNAME:callback_admin}
    password: ${DB_PASSWORD:callback_password123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # Databases first created by Hibernate's old ddl-auto: update already have V1's tables, so they
    # are adopted at V1 instead of failing on "table already exists". On an empty database V1 runs.
    # If such a database lacks a later hand-applied change, ddl-auto: validate refuses to start.
    baseline-on-migrate: true
    baseline-version: 1
  http:
    client:
      # Spring AI's OpenAI client is built from Boot's RestClient.Builder; without a read timeout a
      # hung Groq call would block the Kafka listener thread indefinitely.
      connect-timeout: 5s
      read-timeout: 60s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  ai:
    model:
      chat: openai
    openai:
      base-url: https://api.groq.com/openai
      api-key: ${GROQ_API_KEY}
      chat:
        options:
          model: openai/gpt-oss-120b
          temperature: 0.2

server:
  port: 8086

session-history:
  kafka:
    topic: session-completed
    group-id: session-history-service
