spring:
  application:
    name: question-service
  datasource:
    url: jdbc:postgresql://localhost:5432/callback_question
    username: ${DB_USERNAME:callback_admin}
    password: ${DB_PASSWORD:callback_password123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  ai:
    model:
      chat: openai
      # Nothing here uses embeddings. Without this the OpenAI starter would build an embedding
      # model pointed at Groq, which has no embeddings endpoint.
      embedding: none
    openai:
      base-url: https://api.groq.com/openai
      api-key: ${GROQ_API_KEY}
      chat:
        options:
          model: openai/gpt-oss-120b
          temperature: 0.2

server:
  port: 8084

jd-resume-service:
  base-url: http://localhost:8082

compatibility-service:
  base-url: http://localhost:8083
