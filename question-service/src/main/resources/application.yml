spring:
  application:
    name: question-service
  datasource:
    url: ${QUESTION_DB_URL:jdbc:postgresql://localhost:5432/callback_question}
    username: ${DB_USERNAME:callback_admin}
    password: ${DB_PASSWORD:callback_password123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # Databases first created by Hibernate's old ddl-auto: update already have V1's tables, so they
    # are adopted at V1 instead of failing on "table already exists". On an empty database V1 runs.
    # If such a database lacks a later hand-applied change, ddl-auto: validate refuses to start.
    baseline-on-migrate: true
    baseline-version: 1
  ai:
    model:
      chat: openai
      # Nothing here uses embeddings. Without this the OpenAI starter would build an embedding
      # model pointed at Groq, which has no embeddings endpoint.
      embedding: none
    openai:
      base-url: https://api.groq.com/openai
      api-key: ${GROQ_API_KEY}
      chat:
        options:
          model: openai/gpt-oss-120b
          temperature: 0.2

server:
  port: 8084

jd-resume-service:
  base-url: ${JD_RESUME_SERVICE_URL:http://localhost:8082}

compatibility-service:
  base-url: ${COMPATIBILITY_SERVICE_URL:http://localhost:8083}
