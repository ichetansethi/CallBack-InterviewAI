server:
  port: 8080

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            websocket:
              # Reactor Netty's default is 64KB. voice-orchestrator sends one Piper WAV per
              # sentence (~44KB per second of speech, frames of 300KB+ seen live), so the default
              # made the gateway kill the socket on the first long sentence. 2MB ~= 47s of audio.
              max-frame-payload-length: 2097152
          default-filters:
            # Token bucket in Redis, one bucket per key from RateLimitConfig#userKeyResolver
            # (per user when authenticated, per IP otherwise). Over the limit -> 429 from the
            # gateway itself; the request never reaches the service.
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
          routes:
            - id: auth
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/**
            - id: jd-resume
              uri: ${JD_RESUME_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/jd/**,/resumes/**
            - id: compatibility
              uri: ${COMPATIBILITY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/compatibility/**
            - id: questions
              uri: ${QUESTION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/questions/**
            - id: sessions
              uri: ${SESSION_HISTORY_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/sessions/**
            - id: voice
              uri: ${VOICE_ORCHESTRATOR_URL:ws://localhost:8085}
              predicates:
                - Path=/voice/**
